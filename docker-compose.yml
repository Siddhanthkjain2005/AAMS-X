# AAMS-X full stack.
#
#   docker compose up --build            # api on :8000, ui on :5173
#   docker compose run --rm fetch        # populate the cache (needs network, once)
#   docker compose run --rm index        # rebuild the window index
#   docker compose run --rm benchmark    # re-run the evaluation protocol
#
# ./data is a bind mount on purpose: the recordings are public and belong on the
# host, so the image stays small and the cache survives a rebuild.

services:
  api:
    build: .
    image: aamsx-api
    ports: ["8000:8000"]
    volumes:
      - ./data:/data
      - ./reports/out:/data/reports
    environment:
      AAMSX_DATA_DIR: /data
      AAMSX_REPORTS_DIR: /data/reports
      # The served demo needs no network at all; ingestion is a separate profile.
      AAMSX_ALLOW_NETWORK: "false"
      AAMSX_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE: /api
    image: aamsx-web
    ports: ["5173:80"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ---- one-shot jobs (not started by `up`) ----------------------------------
  fetch:
    build: .
    image: aamsx-api
    profiles: ["tools"]
    volumes: ["./data:/data"]
    environment:
      AAMSX_DATA_DIR: /data
      AAMSX_ALLOW_NETWORK: "true"
    command: ["python", "scripts/fetch_real_data.py"]

  index:
    build: .
    image: aamsx-api
    profiles: ["tools"]
    volumes: ["./data:/data"]
    environment:
      AAMSX_DATA_DIR: /data
    command: ["python", "scripts/build_index.py"]

  benchmark:
    build: .
    image: aamsx-api
    profiles: ["tools"]
    volumes:
      - ./data:/data
      - ./reports/out:/data/reports
    environment:
      AAMSX_DATA_DIR: /data
      AAMSX_REPORTS_DIR: /data/reports
    command: ["python", "scripts/run_benchmark.py", "--seeds", "6"]
