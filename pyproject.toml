[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aamsx"
version = "1.0.0"
description = "AAMS-X — Adaptive Associative Active-Sensing & Memory Scheduler"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AAMS-X" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "scikit-learn>=1.5",
    "jinja2>=3.1",
    "httpx>=0.27",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
neural = ["torch>=2.3"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
aamsx = "aamsx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["aamsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q --strict-markers"
markers = ["network: requires internet access", "slow: long running"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
# This script parses the published markdown, which really does contain typographic
# minus, en dash, multiplication and less-than-or-equal characters. Substituting the
# ASCII lookalikes RUF001 suggests would stop the patterns matching the documents.
"scripts/verify_docs.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
