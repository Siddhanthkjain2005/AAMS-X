# Single-origin serving: the SPA and the API share a host, so the browser needs no
# CORS preflight and the WebSocket upgrade survives.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # leaves clients pinned to a bundle that no longer exists.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;   # long-lived experiment streams
        proxy_buffering off;        # frames must arrive as they are produced
    }

    # Client-side routing: unknown paths are app routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
