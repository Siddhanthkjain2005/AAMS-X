name: Build Azure demo image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: caf851fd20faacr.azurecr.io
          username: caf851fd20faacr
          password: ${{ secrets.AZURE_ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            caf851fd20faacr.azurecr.io/aams-x:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
