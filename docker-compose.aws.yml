# Production-shaped single-host deployment for AWS EC2.
#
# The public surface is nginx on port 80. The API is reachable only from the private
# Compose network through nginx's /api proxy, including WebSocket upgrades. The public
# e-CALLISTO cache stays on the instance so a container rebuild does not erase it.

services:
  api:
    build: .
    image: aamsx-api:aws
    volumes:
      - ./data:/data
      - ./reports/out:/data/reports
    environment:
      AAMSX_DATA_DIR: /data
      AAMSX_REPORTS_DIR: /data/reports
      AAMSX_ALLOW_NETWORK: "false"
      AAMSX_CORS_ORIGINS: '[]'
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE: /api
    image: aamsx-web:aws
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
